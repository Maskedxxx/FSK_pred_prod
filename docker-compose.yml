# =============================================================================
# FSK Defect Analysis Bot - Docker Compose
# =============================================================================
#
# Запуск:
#   docker-compose up --build
#
# Запуск в фоне:
#   docker-compose up -d --build
#
# Просмотр логов:
#   docker-compose logs -f
#
# Остановка:
#   docker-compose down
#
# Требования:
#   - Создайте файл .env с переменной BOT_TOKEN
#   - Пример: BOT_TOKEN=123456789:ABCdefGHIjklMNOpqrsTUVwxyz
#
# =============================================================================

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fsk-defect-bot
    restart: unless-stopped

    # Загружаем переменные окружения из .env файла
    env_file:
      - .env

    # Дополнительные переменные окружения (опционально)
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    # Монтируем volume для временных файлов пайплайна
    # (опционально - для сохранения артефактов между перезапусками)
    volumes:
      - pipeline_data:/tmp/fsk_pipeline

    # Лимиты ресурсов (опционально, для продакшена)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 1G

    # Логирование
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Именованный volume для данных пайплайна
volumes:
  pipeline_data:
